name: 'envfix Diagnose'
description: 'Automatically diagnose CI/build failures using envfix'
branding:
  icon: 'cpu'
  color: 'purple'
inputs:
  log-file:
    description: 'Path to the log/output file to diagnose'
    required: true
  provider:
    description: 'Which AI provider to use (ollama/groq/gemini)'
    required: false
    default: 'groq'
  api-key:
    description: 'The API key for the chosen provider'
    required: true
  github-token:
    description: 'Token for posting PR comments'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Set up Python environment & install envfix
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install envfix

    - name: Run envfix diagnosis
      shell: bash
      run: |
        # Set the correct environment variable for the API key based on the provider
        PROVIDER_LOWER=$(echo "${{ inputs.provider }}" | tr '[:upper:]' '[:lower:]')
        
        if [ "$PROVIDER_LOWER" = "groq" ]; then
          export GROQ_API_KEY="${{ inputs.api-key }}"
        elif [ "$PROVIDER_LOWER" = "gemini" ]; then
          export GEMINI_API_KEY="${{ inputs.api-key }}"
        else
          # Fallback (though ollama doesn't usually use a key, maybe others do)
          export API_KEY="${{ inputs.api-key }}"
        fi
        
        # Run envfix with output-file
        # If envfix errors or raises an exception, we shouldn't fail the pipeline
        envfix diagnose --ci "${{ inputs.log-file }}" --provider "$PROVIDER_LOWER" --output-file result.md || true

    - name: Post diagnosis to Pull Request
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          
          // Check if result.md exists
          if (!fs.existsSync('result.md')) {
            console.log('No result.md found. Skipping comment.');
            return;
          }
          
          const result = fs.readFileSync('result.md', 'utf8').trim();
          
          // If the output is empty or doesn't contain a diagnosis, skip it
          if (!result || !result.includes('**Error detected:**')) {
            console.log('No valid envfix diagnosis found. Skipping comment.');
            return;
          }
          
          // Check if we are running in a Pull Request context
          const prNumber = context.payload.pull_request?.number;
          if (!prNumber) {
            console.log('Not a pull request. The diagnosis is:');
            console.log(result);
            return;
          }
          
          console.log(`Posting diagnosis to PR #${prNumber}...`);
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body: result
          });
