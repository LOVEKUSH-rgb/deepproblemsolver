name: 'envfix CI Diagnostics'
description: 'Automatically diagnose failed CI pipeline steps using envfix and comment on the active PR.'
branding:
  icon: 'cpu'
  color: 'purple'
inputs:
  log-path:
    description: 'Path to the log file containing the error output.'
    required: true
  github-token:
    description: 'GitHub token for posting PR comments.'
    required: true
  provider:
    description: 'AI provider to use for diagnosis (e.g., groq, gemini, ollama).'
    required: false
  model:
    description: 'AI model tag to use for diagnosis.'
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Python environment & install envfix
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "${{ github.action_path }}"

    - name: Run envfix diagnosis
      shell: bash
      run: |
        PROVIDER_ARG=""
        MODEL_ARG=""
        
        if [ -n "${{ inputs.provider }}" ]; then
          PROVIDER_ARG="--provider ${{ inputs.provider }}"
        fi
        
        if [ -n "${{ inputs.model }}" ]; then
          MODEL_ARG="--model ${{ inputs.model }}"
        fi
        
        # We use $GITHUB_ENV to capture multiline markdown in case we want it for step summaries later,
        # but the simplest approach is just writing it to a file.
        envfix diagnose --ci ${{ inputs.log-path }} $PROVIDER_ARG $MODEL_ARG > envfix_report.md

    - name: Post diagnosis to Pull Request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ -n "${{ github.event.pull_request.number }}" ]; then
          echo "Posting diagnosis to PR #${{ github.event.pull_request.number }}..."
          gh pr comment ${{ github.event.pull_request.number }} -F envfix_report.md
        else
          echo "Not a pull request. Skipping comment. Here is the diagnosis:"
          cat envfix_report.md
        fi
